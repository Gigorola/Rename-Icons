name: Build tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack
        run: unzip -q RenameIcons.zip -d src

      - name: Fix prefs Makefile
        working-directory: src/RenameIcons/prefs
        run: |
          cat > Makefile <<'EOF'
          TARGET := iphone:clang:latest:14.0
          ARCHS = arm64 arm64e
          THEOS_PACKAGE_SCHEME = rootless

          include $(THEOS)/makefiles/common.mk

          BUNDLE_NAME = RenameIconsPrefs

          RenameIconsPrefs_FILES = RIConfig.m RIAppController.m RIRootListController.m
          RenameIconsPrefs_FRAMEWORKS = UIKit
          RenameIconsPrefs_LDFLAGS = -undefined dynamic_lookup
          RenameIconsPrefs_INSTALL_PATH = /Library/PreferenceBundles
          RenameIconsPrefs_CFLAGS = -fobjc-arc

          include $(THEOS_MAKE_PATH)/bundle.mk
          EOF

      - name: Install Theos
        run: |
          brew install ldid dpkg make
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        working-directory: src/RenameIcons
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          chmod 755 layout/DEBIAN/postinst
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: RenameIcons-deb
          path: src/RenameIcons/packages/*.deb
